<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Memory Box</title>
<link rel="stylesheet" href="lib/leaflet.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div>
    <h1 id="title">Memory Box</h1>
    <p id="stats"></p>
  </div>
  <nav>
    <button data-tab="timeline" class="active">Timeline</button>
    <button data-tab="places">Places</button>
    <button id="play">▶ Play the trip</button>
  </nav>
</header>
<main>
  <section id="mapwrap">
    <div id="map"></div>
    <div id="recapCard" hidden></div>
    <label class="tiles"><input type="checkbox" id="tiles"> Street map (needs internet)</label>
  </section>
  <section id="panel">
    <div id="timeline" class="tab"></div>
    <div id="places" class="tab" hidden></div>
  </section>
</main>
<div id="lightbox" hidden>
  <button class="close" aria-label="Close">×</button>
  <button class="prev" aria-label="Previous">‹</button>
  <figure><img alt=""><figcaption></figcaption></figure>
  <button class="next" aria-label="Next">›</button>
</div>
<script src="lib/leaflet.js"></script>
<script src="lib/topojson-client.min.js"></script>
<script src="lib/world.js"></script>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
